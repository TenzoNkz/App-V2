name: Horizon Cooler Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      - name: Verify toolchain
        run: |
          flutter --version
          java -version
          gradle --version

      - name: Prepare Flutter local.properties
        shell: bash
        run: |
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties

      - name: Restore Gradle wrapper if missing
        working-directory: android
        shell: bash
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          fi

      - name: Prepare optional production signing
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/horizon-release.p12"
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/signing/horizon-release.p12"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Architecture regression audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path("lib/main.dart").read_text(encoding="utf-8")

          required = [
              "Firebase.initializeApp()",
              "FirebaseDatabase.instanceFor",
              'child("firmware_update").get()',
              "onChangeEnd",
              "flutter_secure_storage",
          ]
          for token in required:
              if token not in source:
                  raise SystemExit(f"ARCHITECTURE AUDIT FAILED: missing {token}")

          forbidden = [
              r"telemetry/",
              r"_firmwareDbRef\s*!?\.update\s*\(",
              r"_firmwareDbRef\s*!?\.set\s*\(",
              r"_firmwareDbRef\s*!?\.push\s*\(",
              r"_firmwareDbRef\s*!?\.removeValue\s*\(",
              r"DatabaseEvent",
              r"_firebaseConnectionSubscription",
          ]
          for pattern in forbidden:
              if re.search(pattern, source):
                  raise SystemExit(f"ARCHITECTURE AUDIT FAILED: forbidden Firebase/runtime pattern: {pattern}")

          if not re.search(r"serviceUuids", source):
              raise SystemExit("ARCHITECTURE AUDIT FAILED: BLE service UUID discovery missing")
          if not re.search(r"onChangeEnd\s*:\s*isConnected", source):
              raise SystemExit("ARCHITECTURE AUDIT FAILED: brightness commit-on-release contract missing")
          if "setString('saved_pass'" in source or 'setString("saved_pass"' in source:
              raise SystemExit("ARCHITECTURE AUDIT FAILED: WiFi password still stored in SharedPreferences")
          if "obscureText: false" not in source:
              raise SystemExit("ARCHITECTURE AUDIT FAILED: WiFi password visibility contract changed")

          print("Architecture audit passed.")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-Cooler-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Dart symbols
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-Cooler-Dart-Symbols
          path: build/symbols
